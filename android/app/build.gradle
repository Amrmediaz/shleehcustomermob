plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.shellahadmin.shellahcustomer"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.shellahadmin.shellahcustomer"
        minSdkVersion 24
        targetSdkVersion 36
        // Note: Flutter's declarative plugin dynamically applies versionCode and versionName 
        // from your pubspec.yaml unless explicitly hardcoded here.
        versionCode 57
        versionName '6.8'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.annotation:annotation:1.8.2'
        force 'androidx.annotation:annotation-jvm:1.8.2'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.10"
}