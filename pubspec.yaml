name: shleehcustomer
description: Application for booking buildings
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3

environment:
  sdk: '>=3.0.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Bloc for state management
  flutter_bloc: ^9.1.1
  # Functional programming things
  dartz: ^0.10.1
  # Value equality
  equatable: ^2.0.5
  # Service locator
  get_it: ^9.2.1
  # Remote API
  internet_connection_checker: ^3.0.1
  http: ^1.6.0
  # Local cache
  shared_preferences: ^2.1.1
  #Country code Picker
  country_code_picker: ^3.0.0
  intl: ^0.20.2
  easy_localization: ^3.0.0
  flutter_to_pdf: ^0.4.1
  path_provider: ^2.1.2
  flutter_pdfview: ^1.4.4
  pdf: ^3.10.8
  #On Board
  flutter_onboard: ^2.0.0

  transparent_image: ^2.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  #bottom navigation
  persistent_bottom_nav_bar: ^6.2.1

  flutter_onboarding_slider: ^1.0.11
  shimmer: ^3.0.0
  flutter_toggle_tab: ^1.3.0
  calendar_date_picker2: ^3.0.0
  google_maps_flutter: ^2.5.3
  cached_network_image: ^3.3.1
  clipboard: ^3.0.14
  url_launcher: ^6.1.14
  webview_flutter: ^4.5.0
  gif: ^2.2.0
  device_info_plus: ^13.1.0

  #svg
  flutter_svg: ^2.0.9

  # Share a chalet/building link via the native share sheet (WhatsApp, SMS, etc.)
  share_plus: ^10.1.4
  # Fingerprint / Face ID login
  local_auth: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.16.0
  # Tools to write binaries that run builders.
  build_runner: ^2.1.2

  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.8.0

  # Mock library for Dart inspired by Mockito.
  mockito: ^5.0.16

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
dependency_overrides:
  win32: ^5.5.1
  gif: ^2.3.0
  device_info_plus: 12.4.0
  # Pinned below the 2.5.0/2.6.0 FFI (package:objective_c) rewrite, which
  # ships a broken x86_64-only/missing-arm64 objective_c.framework on
  # archive builds. See path_provider_foundation changelog: 2.5.0 was
  # retracted for "production build issues", 2.5.1 reverted it, 2.6.0
  # re-released the same rewrite. Revert this once a fixed version ships.
  path_provider_foundation: 2.4.3
# The following section is specific to Flutter packages.
flutter:
  # This project's ios/Runner.xcodeproj was never migrated to Swift Package
  # Manager. Flutter 3.44 defaults to SPM for iOS plugins, which silently
  # drops SPM-capable plugins (clipboard, connectivity_plus, etc.) out of
  # the Podfile without wiring them into Xcode any other way, causing
  # "Module 'X' not found". Force pure CocoaPods until the Xcode project
  # is properly migrated.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - resources/language/
    - assets/images/landing/
    - assets/images/appbar/
    - assets/images/buildings/
    - assets/images/setting/
    - assets/images/omr_symbol.png
    - assets/certs/

  fonts:
    - family: open_sans
      fonts:
        - asset: assets/fonts/open_sans.ttf
    - family: FFShamelFamily
      fonts:
        - asset: assets/fonts/FFShamelFamily-SansOneBold.ttf

    - family: FFShamelFamilyRegular
      fonts:
        - asset: assets/fonts/FFShamelFamily-SansOneBook.ttf






